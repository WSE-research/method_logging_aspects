# Java CI test gate for the AspectJ logging aspect (Maven project lives in the
# method_logging_aspect/ subdirectory).
name: Java CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: maven
      - name: Build and test with Maven
        run: mvn --batch-mode --update-snapshots -f method_logging_aspect/pom.xml test
